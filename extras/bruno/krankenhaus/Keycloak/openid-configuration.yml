info:
  name: openid-configuration
  type: http
  seq: 4

http:
  method: GET
  url: "{{realmUrl}}/.well-known/openid-configuration"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.token_endpoint
      operator: matches
      value: /protocol/openid-connect/token$

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
