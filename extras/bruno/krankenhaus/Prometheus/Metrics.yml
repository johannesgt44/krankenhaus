info:
  name: Metrics
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/prometheus"
  headers:
    - name: Accept
      value: text/plain
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isString
    - expression: res.body
      operator: matches
      value: "# HELP"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
