info:
  name: Krankenhaus 20 mit ungueltigen Daten ändern
  type: http
  seq: 3

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: If-Match
      value: '"0"'
  params:
    - name: id
      value: "20"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "mitarbeiteranzahl": -150,
        "bettenanzahl": -75,
        "email": "put-test"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/problem\+json(; charset=utf-8)?$

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
