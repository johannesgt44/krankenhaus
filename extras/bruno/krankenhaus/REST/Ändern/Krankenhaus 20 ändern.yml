info:
  name: Krankenhaus 20 ändern
  type: http
  seq: 1

http:
  method: PUT
  url: "{{restUrl}}/:id"
  headers:
    - name: Content-Type
      value: application/json
    - name: If-Match
      value: '"0"'
  params:
    - name: id
      value: "20"
      type: path
  body:
    type: json
    data: |-
      {
        "name": "Krankenhaus Test Geaendert",
        "mitarbeiteranzahl": 150,
        "bettenanzahl": 75,
        "email": "put-test-geaendert@krankenhaus.de"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
    - expression: res.headers.etag
      operator: eq
      value: "'\"1\"'"
    - expression: res.body
      operator: isString
    - expression: res.body
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
