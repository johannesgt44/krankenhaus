info:
  name: Mitarbeiteranzahl kleiner gleich 300
  type: http
  seq: 3

http:
  method: GET
  url: "{{restUrl}}?mitarbeiteranzahl=300"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: mitarbeiteranzahl
      value: "300"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: isArray
    - expression: res.body.content
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
