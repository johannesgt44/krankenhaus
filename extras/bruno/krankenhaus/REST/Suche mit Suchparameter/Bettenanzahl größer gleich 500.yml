info:
  name: Bettenanzahl größer gleich 500
  type: http
  seq: 5

http:
  method: GET
  url: "{{restUrl}}?bettenanzahl=500"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: bettenanzahl
      value: "500"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: isArray
    - expression: res.body.content
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
