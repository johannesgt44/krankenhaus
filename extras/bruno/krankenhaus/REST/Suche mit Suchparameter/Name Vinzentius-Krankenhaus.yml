info:
  name: Name Vinzentius-Krankenhaus
  type: http
  seq: 2

http:
  method: GET
  url: "{{restUrl}}?name=Vinzentius-Krankenhaus"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: name
      value: Vinzentius-Krankenhaus
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: isArray
    - expression: res.body.content[0].name
      operator: eq
      value: Vinzentius-Krankenhaus

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
