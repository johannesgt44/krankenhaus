info:
  name: Suche Name, Ort von allen Krankenhaeusern
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      {
        krankenhaeuser {
          id
          version
          adresse {
            ort
          }
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
