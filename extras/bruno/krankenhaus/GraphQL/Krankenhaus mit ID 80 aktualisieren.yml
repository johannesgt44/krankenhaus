info:
  name: Krankenhaus mit ID 80 aktualisieren
  type: graphql
  seq: 5

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Accept
      value: application/graphql-response+json
  body:
    query: |-
      mutation {
        update(
          input: {
            id: 80,
            version: 1,
            name: "Update",
            mitarbeiteranzahl: 0,
            bettenanzahl: 0,
            email: "test@update.de"
          }
        ) {
            version
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: matches
      value: ^application\/graphql-response\+json(; charset=utf-8)?$
    - expression: res.body.data.update.version
      operator: isNumber
    - expression: res.body.data.update.version
      operator: gte
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
